<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>عيادة يشفين لطب الأسنان</title>

<style>
:root{
  --ink:#153f46;
  --gold:#c59a35;
  --paper:#fffdf8;
  --soft:#eef5f4;
  --danger:#8e2f2f;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--soft);
  color:#182126;
  line-height:1.8;
}

.wrap{
  max-width:780px;
  margin:auto;
  min-height:100vh;
  background:var(--paper);
}

.hero{
  text-align:center;
  padding:34px 20px 24px;
  background:linear-gradient(145deg,#fffdf8,#edf7f4);
  border-bottom:4px solid var(--gold);
}

.logo{
  font-size:56px;
}

h1{
  margin:4px 0;
  color:var(--ink);
  font-size:30px;
}

.sub{
  color:#7d651d;
  font-weight:700;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:18px;
}

.btn{
  padding:14px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  font-weight:800;
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.primary{
  background:var(--ink);
  color:white;
}

.secondary{
  background:var(--gold);
  color:#1d2629;
}

.danger{
  background:var(--danger);
  color:white;
}

section{
  padding:18px;
}

h2{
  font-size:23px;
  color:var(--ink);
  border-right:5px solid var(--gold);
  padding-right:10px;
  margin:0 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.card{
  background:#fff;
  border:1px solid #dde7e4;
  border-radius:14px;
  padding:13px;
  box-shadow:0 2px 10px #0000000c;
}

details{
  background:#fff;
  border:1px solid #dde7e4;
  border-radius:14px;
  padding:12px 14px;
  margin:9px 0;
}

summary{
  font-weight:800;
  color:var(--ink);
  cursor:pointer;
}

.note{
  background:#fff4d5;
  border-right:5px solid var(--gold);
  padding:12px;
  border-radius:10px;
}

.map-btn{
  display:block;
  margin:18px 0;
  padding:15px;
  border-radius:14px;
  background:var(--ink);
  color:#fff;
  text-decoration:none;
  text-align:center;
  font-weight:800;
}

.map-title{
  text-align:center;
  color:var(--ink);
  font-size:19px;
  font-weight:800;
  margin:22px 0 10px;
}

.clinic-map{
  display:block;
  width:100%;
  height:auto;
  border-radius:16px;
  border:1px solid #dde7e4;
}

footer{
  background:var(--ink);
  color:white;
  text-align:center;
  padding:22px;
}

.hidden{
  display:none !important;
}

/* لوحة الإحصائيات الخاصة */

.owner-panel{
  background:#f6faf9;
  border-top:4px solid var(--gold);
  padding:18px;
}

.owner-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px 0;
}

.stat{
  text-align:center;
  background:var(--ink);
  color:white;
  border-radius:14px;
  padding:16px 8px;
}

.stat strong{
  display:block;
  font-size:34px;
  color:#ffd978;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cad9d5;
  border-radius:10px;
  margin:6px 0;
  font:inherit;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:9px;
  border-bottom:1px solid #e1e8e6;
  text-align:center;
}

th{
  background:#f0f5f3;
